name: Bug report
description: Report a reproducible Playroma jRPG defect
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Use a synthetic or redistributable project whenever possible.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Playroma revision or version
    validations:
      required: true
  - type: dropdown
    id: data-risk
    attributes:
      label: Did this risk project data loss?
      options: ["No", "Possibly", "Yes"]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and diagnostics
      description: Remove private paths, secrets, and proprietary project content.
